<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>孵化你的社交分身 · DeepMate</title>
<style>
  :root{
    --bg1:#fff7fb; --bg2:#f4f1ff; --ink:#242338; --muted:#7c7a8f;
    --purple:#7c5cff; --pink:#ff72a8; --card:#fff; --line:#ebe7fb;
    --shadow:0 20px 50px rgba(83,65,160,.14);
  }
  *{box-sizing:border-box}
  body{
    margin:0; color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(circle at 15% 10%, #ffe6f0 0, transparent 28%),
      radial-gradient(circle at 88% 12%, #e9e1ff 0, transparent 30%),
      linear-gradient(180deg,var(--bg1),var(--bg2));
    min-height:100vh;
  }
  .app{width:min(100%,520px);margin:0 auto;min-height:100vh;padding:20px 16px 36px}
  .screen{display:none}.screen.active{display:block}
  .brand{font-size:13px;color:var(--muted);letter-spacing:.08em;margin:4px 4px 20px}
  .hero,.card,.result{
    background:rgba(255,255,255,.92); border:1px solid var(--line);
    border-radius:30px; box-shadow:var(--shadow);
  }
  .hero{padding:28px 22px 24px;overflow:hidden;position:relative}
  .blob{
    width:118px;height:118px;border-radius:38% 62% 58% 42%/46% 45% 55% 54%;
    background:linear-gradient(135deg,#8f78ff,#ff86b8);
    display:flex;align-items:center;justify-content:center;font-size:52px;
    margin:4px auto 20px;animation:float 3s ease-in-out infinite;
  }
  @keyframes float{50%{transform:translateY(-6px) rotate(3deg)}}
  .eyebrow{
    display:inline-flex;padding:7px 11px;border-radius:999px;
    background:#f0ebff;color:var(--purple);font-size:13px;font-weight:800;
  }
  h1{font-size:30px;line-height:1.2;margin:14px 0 12px;text-align:center}
  .sub{font-size:15px;line-height:1.75;color:var(--muted);text-align:center;margin-bottom:20px}
  .mini{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:22px}
  .chip{font-size:12px;padding:7px 9px;border-radius:12px;background:#faf8ff;border:1px solid var(--line);color:#66637a}
  button{font:inherit;cursor:pointer}
  .primary{
    width:100%;border:0;border-radius:18px;padding:16px 18px;font-weight:900;font-size:16px;
    color:#fff;background:linear-gradient(135deg,var(--purple),var(--pink));
    box-shadow:0 10px 26px rgba(124,92,255,.24)
  }
  .top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .progress-wrap{height:8px;background:#ebe7f7;border-radius:999px;overflow:hidden;flex:1}
  .progress{height:100%;width:0;background:linear-gradient(90deg,var(--purple),var(--pink));transition:.25s}
  .count{font-size:12px;color:var(--muted)}
  .card{padding:20px}
  .scene{
    font-size:12px;color:var(--purple);font-weight:900;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px
  }
  .q{font-size:22px;line-height:1.45;font-weight:900;margin-bottom:8px}
  .hint{font-size:13px;color:var(--muted);margin-bottom:16px}
  .option{
    width:100%;display:flex;align-items:center;gap:12px;text-align:left;
    border:1px solid #ebe8f5;background:#fff;border-radius:18px;padding:14px 14px;margin:9px 0;
    color:var(--ink);font-size:15px;font-weight:700;line-height:1.45;transition:.16s
  }
  .option:hover,.option:active{transform:translateY(-1px);border-color:#bcb0ff;background:#fbfaff}
  .icon{
    width:38px;height:38px;border-radius:13px;background:#f3efff;display:flex;align-items:center;justify-content:center;
    flex:0 0 auto;font-size:20px
  }
  .toast{
    margin-top:12px;text-align:center;color:#8c88a1;font-size:12px;min-height:18px
  }
  .result{padding:24px 20px}
  .passport{
    background:linear-gradient(145deg,#2b2640,#4f3d83);
    color:white;border-radius:26px;padding:22px;position:relative;overflow:hidden;margin-bottom:18px
  }
  .passport:after{
    content:"";position:absolute;width:160px;height:160px;border-radius:50%;
    background:rgba(255,255,255,.08);right:-45px;top:-48px
  }
  .passport-top{font-size:12px;opacity:.72;letter-spacing:.12em}
  .agent-avatar{
    width:72px;height:72px;border-radius:24px;background:linear-gradient(135deg,#9078ff,#ff7fb3);
    display:flex;align-items:center;justify-content:center;font-size:38px;margin:18px 0 12px
  }
  .type{font-size:28px;font-weight:950;margin-bottom:8px}
  .code{font-size:12px;opacity:.7}
  .desc{font-size:15px;color:#5f5d70;line-height:1.8}
  .section{
    margin:16px 0;padding:16px;border-radius:18px;background:#faf8ff;border:1px solid var(--line)
  }
  .section-title{font-size:13px;font-weight:900;color:#625b87;margin-bottom:8px}
  .section-body{font-size:14px;color:#5f5d70;line-height:1.7}
  .meter{margin:16px 0}
  .meter-label{display:flex;justify-content:space-between;font-size:12px;color:#6f6c7f;margin-bottom:6px}
  .bar{height:8px;background:#eeeaf7;border-radius:999px;overflow:hidden}
  .fill{height:100%;background:linear-gradient(90deg,var(--purple),var(--pink));border-radius:999px}
  .quote{
    margin:18px 0;padding:15px 16px;border-radius:18px;background:#faf7ff;border:1px solid var(--line);
    font-size:14px;line-height:1.65;color:#575469
  }
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
  .ghost{
    width:100%;border:0;border-radius:18px;padding:14px 18px;font-weight:800;background:#f2edff;color:var(--purple)
  }
  .share{
    width:100%;border:0;border-radius:18px;padding:14px 18px;font-weight:800;color:white;
    background:linear-gradient(135deg,var(--purple),var(--pink))
  }
  .foot{text-align:center;color:#9995a8;font-size:12px;line-height:1.6;margin-top:16px}
</style>
</head>
<body>
<div class="app">

<section id="start" class="screen active">
  <div class="brand">DEEPMATE · FUTURE RELATIONSHIP LAB</div>
  <div class="hero">
    <div class="blob">🪐</div>
    <div style="text-align:center"><span class="eyebrow">1 分钟孵化实验</span></div>
    <h1>孵化你的<br>社交 AI 分身</h1>
    <div class="sub">
      它会替你破冰，帮你找对的人，还是默默记住所有关系线索？<br>
      做 7 个选择，看看你的 AI 分身会长成什么样。
    </div>
    <div class="mini">
      <span class="chip">7 个社交瞬间</span>
      <span class="chip">约 60 秒</span>
      <span class="chip">生成分身通行证</span>
    </div>
    <button class="primary" onclick="startQuiz()">开始孵化 ✦</button>
  </div>
  <div class="foot">仅用于偏好探索，不是心理诊断。</div>
</section>

<section id="quiz" class="screen">
  <div class="top">
    <div class="progress-wrap"><div id="progress" class="progress"></div></div>
    <div id="count" class="count"></div>
  </div>
  <div class="card">
    <div id="scene" class="scene"></div>
    <div id="q" class="q"></div>
    <div id="hint" class="hint"></div>
    <div id="opts"></div>
    <div id="toast" class="toast"></div>
  </div>
</section>

<section id="result" class="screen">
  <div class="brand">YOUR SOCIAL AGENT PASSPORT</div>
  <div class="result">
    <div class="passport">
      <div class="passport-top">DEEPMATE · SOCIAL AGENT TYPE</div>
      <div id="avatar" class="agent-avatar"></div>
      <div id="type" class="type"></div>
      <div id="code" class="code"></div>
    </div>

    <div id="desc" class="desc"></div>

    <div class="section">
      <div class="section-title">你的分身最适合帮你</div>
      <div id="bestFor" class="section-body"></div>
    </div>

    <div class="meter">
      <div class="meter-label"><span>主动帮忙</span><span id="actLabel"></span></div>
      <div class="bar"><div id="actBar" class="fill"></div></div>
    </div>
    <div class="meter">
      <div class="meter-label"><span>代你执行</span><span id="execLabel"></span></div>
      <div class="bar"><div id="execBar" class="fill"></div></div>
    </div>
    <div class="meter">
      <div class="meter-label"><span>隐私敏感</span><span id="privacyLabel"></span></div>
      <div class="bar"><div id="privacyBar" class="fill"></div></div>
    </div>

    <div class="quote" id="quote"></div>

    <div class="section">
      <div class="section-title">使用说明</div>
      <div id="guide" class="section-body"></div>
    </div>

    <div class="actions">
      <button class="share" onclick="copyResult()">复制结果文案</button>
      <button class="ghost" onclick="restartQuiz()">重新测一次</button>
    </div>
  </div>
  <div class="foot">DeepMate 社交分身测试 · Demo v3</div>
</section>

</div>

<script>
const SUPABASE_URL="https://svlrwcjebajiwaljapax.supabase.co";
const SUPABASE_KEY="sb_publishable_3aOgSVnklUZB08RyhIyp_Q_Rb78uZ0N";

async function dbInsert(table, payload){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}`,{
      method:"POST",
      headers:{
        "apikey":SUPABASE_KEY,
        "Content-Type":"application/json",
        "Prefer":"return=minimal"
      },
      body:JSON.stringify(payload)
    });
    if(!res.ok){
      const msg = await res.text();
      console.warn(`db write failed: ${table}`, res.status, msg);
    }
  }catch(e){ console.warn("db write skipped",e); }
}

const types={
  icebreaker:{name:"破冰火花体",emoji:"✨",code:"SPARK / 01",
    desc:"你的分身最擅长替你点燃第一句话。你并不缺想法，只是需要一个更自然的起点，让陌生关系少一点尴尬。",
    best:"开场、回复、接话、把聊天自然推进到下一步。",
    guide:"适合在你想主动但又怕太刻意的时候出现。它应该给你 2–3 个像你本人会说的版本，而不是直接替你发送。",
    quote:"分身口头禅：先别想那么多，我帮你把第一句话变自然。",
    act:74,exec:42,privacy:55},
  radar:{name:"缘分雷达体",emoji:"📡",code:"RADAR / 02",
    desc:"你最想省下的是“无效社交”的时间。你的分身会帮你在人、机会和圈子里先做筛选，再把真正值得的人推到你面前。",
    best:"找人、筛选、判断是否值得继续投入。",
    guide:"适合在新关系开始前帮你减少试错，但最终“要不要继续认识”应该由你决定。",
    quote:"分身口头禅：人很多，但真正值得你花时间的不多。",
    act:82,exec:48,privacy:52},
  keeper:{name:"关系记忆体",emoji:"🧠",code:"KEEPER / 03",
    desc:"你在意的不是认识更多人，而是不要把重要的人慢慢弄丢。你的分身会记住细节、上下文和那些容易被忘掉的关系线索。",
    best:"记住关系、提醒联系、整理对方偏好和重要节点。",
    guide:"适合长期陪伴，但所有记忆都应该能被你查看、修改和删除。",
    quote:"分身口头禅：你忘了没关系，我记得。",
    act:68,exec:50,privacy:66},
  secretary:{name:"行动加速体",emoji:"⚡",code:"DOER / 04",
    desc:"你不想再被约时间、提醒、跟进这些小事消耗。只要规则清楚，你愿意让 AI 真正把事情往前推。",
    best:"日程协调、提醒、跟进、低风险的社交事务。",
    guide:"适合把重复的小事交给 AI。简单事项可以自动做，涉及关系判断和重要表达时再把你拉回来确认。",
    quote:"分身口头禅：别把脑力浪费在可以自动完成的小事上。",
    act:88,exec:86,privacy:44},
  guardian:{name:"边界守护体",emoji:"🛡️",code:"GUARD / 05",
    desc:"你不是拒绝 AI，而是要求它先学会尊重。对你来说，真正聪明的 Agent 必须知道什么能做、什么绝对不能碰。",
    best:"权限控制、隐私保护、重要动作确认。",
    guide:"你的理想 Agent 应该默认少做一步，而不是多做一步。任何对外发送、信息共享和长期保存都需要透明。",
    quote:"分身口头禅：可以帮，但先把边界说清楚。",
    act:38,exec:22,privacy:94},
  companion:{name:"情绪共振体",emoji:"🌙",code:"ECHO / 06",
    desc:"你更希望 AI 先理解你，而不是立刻替你做决定。你的分身会像一个长期在线的情绪缓冲区，帮你整理感受和表达。",
    best:"倾诉、情绪梳理、关系复盘、帮你把真实感受说清楚。",
    guide:"适合在你需要被理解的时候出现，但不应该把情绪建议变成替你做关系决定。",
    quote:"分身口头禅：我先听你说完，再想要不要解决。",
    act:58,exec:24,privacy:70}
};

const qs=[
 {scene:"SCENE 01 · 凌晨 00:47",q:"你盯着一条消息看了 5 分钟，还没有回。你希望分身做什么？",hint:"不要想“正确答案”，选你真的会想用的。",
  opts:[["💬","给我一个自然、不油腻的回复","icebreaker"],["🧭","先判断这个人值不值得我继续聊","radar"],["🗂️","提醒我上次和 TA 聊到哪里","keeper"],["⚡","帮我整理重点，我确认后直接发","secretary"],["🛡️","先别碰，我只想自己决定","guardian"],["🌙","先听我吐槽一下为什么不想回","companion"]]},
 {scene:"SCENE 02 · 周五晚上",q:"朋友突然说：今晚出来吗？你最希望 AI 帮哪一步？",hint:"",
  opts:[["✨","帮我想一句不尴尬的回应","icebreaker"],["📡","先判断这局里的人和我合不合","radar"],["🧠","告诉我最近是不是很久没见他们了","keeper"],["📅","直接帮我看日历、路线和时间","secretary"],["🔒","任何对外动作都必须先问我","guardian"],["🌙","我纠结去不去，先陪我分析","companion"]]},
 {scene:"SCENE 03 · 新关系出现",q:"你刚认识一个挺有意思的人。哪种能力最像“开挂”？",hint:"",
  opts:[["💬","自动发现我们能聊起来的话题","icebreaker"],["🎯","判断彼此是不是值得继续了解","radar"],["🧠","记住 TA 的兴趣和聊天细节","keeper"],["⚡","合适时直接提醒我推进下一步","secretary"],["🛡️","明确告诉我哪些信息不该分享","guardian"],["🌙","帮我分清喜欢、上头和焦虑","companion"]]},
 {scene:"SCENE 04 · 工作消息 99+",q:"如果你的 Agent 能替你省下一件麻烦事，你选？",hint:"",
  opts:[["✍️","把消息改得更像我本人会说的话","icebreaker"],["🔎","帮我筛掉低价值的人和邀约","radar"],["📚","自动整理每个人的上下文","keeper"],["🤖","按规则处理低风险事务","secretary"],["🚫","别偷偷做，必须让我知道","guardian"],["💭","帮我把压力和情绪先理顺","companion"]]},
 {scene:"SCENE 05 · 双方 Agent 初次见面",q:"如果双方都同意让 AI 先聊 30 秒，你最想让它交换什么？",hint:"",
  opts:[["✨","共同话题和一个自然开场点","icebreaker"],["📡","目标、兴趣和匹配度","radar"],["🧩","双方愿意分享的背景线索","keeper"],["📆","可约时间和下一步安排","secretary"],["🔐","只交换我逐项授权的信息","guardian"],["💜","先判断彼此的交流舒适度","companion"]]},
 {scene:"SCENE 06 · Agent 越来越懂你",q:"哪一刻会让你第一次觉得：‘它真的懂我’？",hint:"",
  opts:[["🗣️","它写出来的话真的像我","icebreaker"],["🎯","它推荐的人我真的愿意认识","radar"],["🧠","它记得我自己都忘了的关系细节","keeper"],["⚡","它把一件麻烦事完整处理好了","secretary"],["🛡️","它主动停下来说：这一步需要你确认","guardian"],["🌙","它知道我此刻只想被理解","companion"]]},
 {scene:"FINAL SCENE · 你的选择",q:"最后，你希望这个分身帮你变成怎样的人？",hint:"选最有感觉的一句。",
  opts:[["✨","更敢表达、更自然地靠近别人","icebreaker"],["📡","把时间留给真正合适的人","radar"],["🧠","不再轻易失去重要关系","keeper"],["⚡","少操心，让关系里的事务更顺","secretary"],["🛡️","始终保有自己的控制权","guardian"],["🌙","更理解自己的感受和关系","companion"]]}
];

let i=0, score={icebreaker:0,radar:0,keeper:0,secretary:0,guardian:0,companion:0};
let sessionId = crypto.randomUUID();
let startedAt = null;
let currentResult = null;
const source = new URLSearchParams(location.search).get("source") || "direct";
const toasts=["分身正在读取你的社交偏好…","有点意思 👀","你的分身轮廓开始出现了","这一题很能区分类型","正在拼接你的关系偏好…","快孵化完成了 ✦"];

function startQuiz(){
  startedAt = Date.now();
  dbInsert("sessions",{client_session_id:sessionId,source,started_at:new Date().toISOString(),user_agent:navigator.userAgent,referrer:document.referrer||null});
  start.classList.remove("active");quiz.classList.add("active");render();
}
function render(){
  const x=qs[i];
  scene.textContent=x.scene;q.textContent=x.q;hint.textContent=x.hint;
  count.textContent=`${i+1}/${qs.length}`;
  progress.style.width=`${(i/qs.length)*100}%`;
  opts.innerHTML="";
  x.opts.forEach(([ic,txt,t],idx)=>{
    const b=document.createElement("button");b.className="option";
    b.innerHTML=`<span class="icon">${ic}</span><span>${txt}</span>`;
    b.onclick=()=>choose(t,idx,txt);opts.appendChild(b);
  });
  toast.textContent=i?toasts[Math.min(i-1,toasts.length-1)]:"";
}
function choose(t, optionIndex, optionText){
  score[t]++;
  dbInsert("answers",{client_session_id:sessionId,question_id:`q${i+1}`,option_id:`${t}_${optionIndex}`,answer_order:optionIndex,answered_at:new Date().toISOString()});
  i++;
  if(i<qs.length){render()}else{showResult()}
}
function showResult(){
  const winner=Object.keys(score).reduce((a,b)=>score[a]>=score[b]?a:b);
  const r=types[winner];
  currentResult=r;
  quiz.classList.remove("active");result.classList.add("active");
  avatar.textContent=r.emoji;type.textContent=r.name;code.textContent=r.code;
  desc.textContent=r.desc;bestFor.textContent=r.best;quote.textContent=r.quote;guide.textContent=r.guide;
  setMeter("act",r.act);setMeter("exec",r.exec);setMeter("privacy",r.privacy);
  dbInsert("completions",{
    client_session_id:sessionId,
    result_type:winner,
    completed_at:new Date().toISOString(),
    duration_seconds: startedAt ? Math.round((Date.now()-startedAt)/1000) : null
  });
}
function setMeter(id,v){
  document.getElementById(id+"Bar").style.width=v+"%";
  document.getElementById(id+"Label").textContent=v>=75?"高":v>=50?"中":"低";
}
function copyResult(){
  if(!currentResult) return;
  const text=`我的 DeepMate 社交 AI 分身是「${currentResult.name}」${currentResult.emoji}\n${currentResult.desc}\n\n${currentResult.quote}`;
  navigator.clipboard?.writeText(text).then(()=>alert("结果文案已复制，可以直接发给朋友～")).catch(()=>{});
}
function restartQuiz(){
  i=0;score={icebreaker:0,radar:0,keeper:0,secretary:0,guardian:0,companion:0};
  sessionId=crypto.randomUUID();startedAt=null;currentResult=null;
  result.classList.remove("active");start.classList.add("active");
}
</script>
</body>
</html>
