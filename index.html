async function dbInsert(table, payload){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}`,{
      method:"POST",
      headers:{
        "apikey":SUPABASE_KEY,
        "Content-Type":"application/json",
        "Prefer":"return=minimal"
      },
      body:JSON.stringify(payload)
    });
    if(!res.ok){
      const msg = await res.text();
      console.warn(`db write failed: ${table}`, res.status, msg);
    }
  }catch(e){ console.warn("db write skipped",e); }
}

    const b=document.createElement("button");b.className="option";
    b.innerHTML=`<span class="icon">${ic}</span><span>${txt}</span>`;
    b.onclick=()=>choose(t,idx,txt);opts.appendChild(b);
  });
  toast.textContent=i?toasts[Math.min(i-1,toasts.length-1)]:"";
}
function choose(t, optionIndex, optionText){
  score[t]++;
  answerTypes.push(t);
  dbInsert("answers",{client_session_id:sessionId,question_id:`q${i+1}`,option_id:`${t}_${optionIndex}`,answer_order:optionIndex,answered_at:new Date().toISOString()});
  i++;
  if(i<qs.length){render()}else{showResult()}
}
function showResult(){
  const maxScore=Math.max(...Object.values(score));
  const tied=Object.keys(score).filter(k=>score[k]===maxScore);
  let winner=tied[0];
  if(tied.length>1){
    for(let j=answerTypes.length-1;j>=0;j--){
      if(tied.includes(answerTypes[j])){winner=answerTypes[j];break;}
    }
  }
  const r=types[winner];
  currentResult=r;
  quiz.classList.remove("active");result.classList.add("active");
  window.scrollTo(0,0);
  avatar.textContent=r.emoji;type.textContent=r.name;code.textContent=r.code;
  desc.textContent=r.desc;bestFor.textContent=r.best;quote.textContent=r.quote;guide.textContent=r.guide;
  setMeter("act",r.act);setMeter("exec",r.exec);setMeter("privacy",r.privacy);
  dbInsert("completions",{
    client_session_id:sessionId,
    result_type:winner,
    completed_at:new Date().toISOString(),
    duration_seconds: startedAt ? Math.round((Date.now()-startedAt)/1000) : null
  });
}
function setMeter(id,v){
  document.getElementById(id+"Bar").style.width=v+"%";
  document.getElementById(id+"Label").textContent=v>=75?"高":v>=50?"中":"低";
}
function copyResult(){
  if(!currentResult) return;
  const text=`我的社交 AI 分身是「${currentResult.name}」${currentResult.emoji}\n${currentResult.desc}\n\n${currentResult.quote}`;
  navigator.clipboard?.writeText(text).then(()=>alert("结果文案已复制，可以直接发给朋友～")).catch(()=>{});
}
function restartQuiz(){
  i=0;score={icebreaker:0,radar:0,detective:0,keeper:0,secretary:0,guardian:0};answerTypes=[];
  sessionId=crypto.randomUUID();startedAt=null;currentResult=null;
  result.classList.remove("active");start.classList.add("active");
  window.scrollTo(0,0);
}
</script>
</body>
</html>
